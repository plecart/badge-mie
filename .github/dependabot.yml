# Mises à jour des dépendances par Dependabot — généré depuis le modèle du Boilerplate (commit
# b0ca9ba) par la première PR de code (#3).
#
# Les actions du `ci.yml` sont épinglées par empreinte de commit, et une empreinte que rien ne met
# à jour est une version gelée : l'écosystème `github-actions` vaut donc pour tout projet.
# Une entrée par écosystème de la stack déclarée suit, sur le même modèle.
#
# Politique commune à toutes les entrées :
# - passage mensuel. Les mises à jour de sécurité ne suivent pas l'intervalle : elles partent à
#   l'avis, si le dépôt les active (doc GitHub « Dependabot security updates », lue le 2026-10-28) ;
# - versions mineures et correctifs groupés en une PR par entrée ; chaque montée majeure a sa
#   PR à elle — elle casse plus souvent, et mêlée au lot elle bloquerait tout le reste —,
#   sauf celles qu'une entrée refuse (`ignore`, raison en commentaire) ;
# - aucun libellé (`labels: []`) : sans cette ligne, Dependabot crée `dependencies` et un libellé
#   par langage, hors du mapping de `.claude/pipeline.config.md` ;
# - commits `chore(deps): …` ou `chore(deps-dev): …` : le préfixe conventional du dépôt ; les PR du
#   bot sont exemptées des métadonnées de PR et de la description en français, qui reste en
#   anglais — Dependabot ne sait pas l'écrire autrement (`.claude/rules/taille-pr.md`).
#
# Une PR du bot se merge comme toute autre : CI verte et go humain, jamais d'auto-merge.

version: 2
updates:
  # Les empreintes de `.github/workflows/*.yml` et leur commentaire de version, mis à jour
  # ensemble.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: []
    commit-message:
      prefix: chore
      include: scope

  # Les dépendances npm des workspaces (`week/`, `api/`, puis `app/`), tenues par le lockfile racine.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Refus : `@types/node` décrit l'API d'une majeure de Node, et le code tourne sur celle de
    # `devEngines.runtime` (Node 24, le runtime des Neon Functions). Une majeure plus haute ferait
    # accepter au type-check une API absente en production. Réexamen : quand le runtime change de
    # majeure, `.github/dependabot.test.ts` rougit et `@types/node` se monte à la main.
    #
    # Refus : `typescript-eslint` borne `typescript` par sa plage de pairs (`<6.1.0` relevé le
    # 2026-11-24) ; une majeure au-delà casse `npm ci` (ERESOLVE). Réexamen : le test rougit quand
    # cette plage accepte la majeure suivante.
    #
    # Refus : le SDK Expo de l'app fixe la version de ces dépendances
    # (`expo/bundledNativeModules.json`) ; elles ne montent qu'avec lui, par `npx expo install
    # --fix`. La liste suit la table : le test rougit si une dépendance de l'app y entre sans
    # refus ici. `expo` reste proposé : sa PR se finit par `npx expo install --fix` sur sa
    # branche, sinon le test rougit sur les épingles que sa table a déplacées. Ce refus coupe
    # aussi les PR de sécurité de ces paquets : l'audit de la CI reste le signal.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/vector-icons"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: expo-font
      - dependency-name: expo-haptics
      - dependency-name: expo-network
      - dependency-name: expo-secure-store
      - dependency-name: expo-status-bar
      - dependency-name: expo-system-ui
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-native-safe-area-context
    labels: []
    commit-message:
      prefix: chore
      include: scope
