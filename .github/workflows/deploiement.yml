# Déploiement de la Neon Function `api` (`api/neon.ts`) par la commande « deploy » de
# `.claude/pipeline.config.md`, « Commandes du projet ». Deux cibles, chacune son déclencheur :
# - la pré-prod, branche Neon `preprod` : chaque push sur `main` dont la CI est verte ;
# - la production, branche Neon `main`, aux vrais pointages : chaque tag `v*` posé sur un commit de `main` à la CI verte.
# Chaque `uses:` est épinglé par empreinte de commit, aux versions de `ci.yml`.

name: Déploiement

# Aucune étape n'écrit sur le dépôt : le jeton ne reçoit que la lecture, du code et des runs
# (la porte lit le verdict de la CI).
permissions:
  contents: read
  actions: read

on:
  # À la fin de chaque run de CI sur `main`, quels qu'en soient l'issue et l'événement : le garde
  # `if:` du job ne garde que les push verts. `workflow_run` ne part que si ce fichier est sur la
  # branche par défaut.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Un filtre `tags` sans `branches` : un push de branche ne déclenche rien ici.
  push:
    tags: ["v*"]

# L'événement désigne la cible, et chaque cible a son groupe : un déploiement en cours n'est
# jamais interrompu ; le suivant attend, et un plus récent remplace celui qui attend.
concurrency:
  group: deploiement-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploiement:
    name: Déploiement de la Function
    runs-on: ubuntu-latest

    # Un tag, ou un run de CI vert né d'un push. Le filtre `branches` ne suffit pas : le passage
    # planifié de la CI tourne lui aussi sur `main` (runs du dépôt relus le 2026-11-27), comme un
    # `workflow_dispatch` lancé depuis `main`, et l'un comme l'autre ne jouent que l'audit ; un run
    # de PR — même d'une branche de fork nommée `main` — n'a pas l'événement `push`.
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      # Sur `workflow_run`, le commit que la CI a éprouvé — `GITHUB_SHA` y est la tête de la branche
      # par défaut, pas ce commit ; sur un tag, `ref` vide prend le commit du tag. Historique
      # complet : la porte lit `origin/main`, que le clone complet écrit pour chaque branche
      # (`getRefSpecForAllHistory` d'`actions/checkout`, lu le 2026-11-27 à l'empreinte épinglée).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # `HEAD`, le commit extrait, est celui qui se déploie.
      # - Un tag posé hors du trunk mettrait en production du code que personne n'a relu.
      # - Un tag n'a pas de CI à lui (`ci.yml` ne tourne que sur les push de `main`) : la porte
      #   exige le run CI vert né du push de ce commit sur `main`, sans quoi la production serait
      #   moins gardée que la pré-prod. Un commit intermédiaire d'un merge `--rebase` n'en a pas :
      #   le tag se pose sur la tête de `main`.
      # - Sur la pré-prod, un run de CI fini en retard ou relancé à la main porte un commit plus
      #   ancien que `main` : il ne déploie rien, le run de la tête s'en charge.
      - name: Porte
        id: porte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Le commit $sha n'est pas sur origin/main : il ne se déploie pas."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            verts=$(gh run list --workflow CI --event push --commit "$sha" --status success --json databaseId --jq length)
            if [ "$verts" = 0 ]; then
              echo "::error::Aucun run CI vert né du push de $sha sur main : la production ne se déploie pas ; si la CI de main tourne encore, relancer ce run une fois verte."
              exit 1
            fi
          elif [ "$sha" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::$sha n'est plus la tête de main : rien à déployer, le run de la tête s'en charge."
            exit 0
          fi
          echo "deployer=true" >> "$GITHUB_OUTPUT"

      # Node depuis `devEngines.runtime` du `package.json` racine, comme `ci.yml`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.porte.outputs.deployer == 'true'
        with:
          node-version-file: package.json
          cache: npm

      - name: Install
        if: steps.porte.outputs.deployer == 'true'
        run: npm ci

      # La clé d'API Neon n'entre qu'ici, jamais dans `npm ci` ; un secret absent vaut une chaîne
      # vide, et le pas s'arrête avant. Le jeton de l'API, lui, n'entre jamais en CI (ADR-0001,
      # « Décision », point 3) : sans `JETON_API`, le déploiement garde celui déjà déployé
      # (`api/neon.ts`). Le script `deploy` charge `api/.env.local`, que `neon deploy --env` exige
      # présent. La CLI `neon` lit `NEON_API_KEY`.
      # `--yes`, aucune invite n'ayant de réponse ici, vaut `--update-existing` et
      # `--allow-protected` (`neon deploy --help`) : il aligne sans demander la branche Neon sur
      # `api/neon.ts` et passe la protection de la branche de production — le tag est l'acte de
      # livraison.
      - name: Déploiement
        if: steps.porte.outputs.deployer == 'true'
        env:
          BRANCHE_NEON: ${{ github.event_name == 'push' && 'main' || 'preprod' }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          : "${NEON_API_KEY:?le secret NEON_API_KEY est vide}"
          touch api/.env.local
          npm run deploy -w api -- --branch "$BRANCHE_NEON" --yes
